<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stepper-Servo Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <h2>Stepper-Servo Controller</h2>


    <section>
      <fieldset>
        <legend>Parameters</legend>
        <label
          >Feed Rate (mm/min):
          <input name="feedRate" type="number" step="1" disabled
        /></label>
        <label
          >Loop Height (mm):
          <input name="loopHeightInput" type="number" step="0.1" disabled
        /></label>
        <label
          >Loop Length (mm):
          <input name="loopLength" type="number" step="0.1" disabled
        /></label>
        <label
          >Retract Length (mm):
          <input name="retractLength" type="number" step="0.1" disabled
        /></label>
      </fieldset>
    </section>

    <section>
      <fieldset>
        <legend>Configuration</legend>
        <label
          >Min Angle (°):
          <input name="minAngleRaw" type="number" step="1" disabled
        /></label>
        <label
          >deg/sec (s/°):
          <input name="degSec" type="number" step="0.0001" disabled
        /></label>
        <label
          >Rise Time (ms):
          <input name="riseTimeRaw" type="number" step="1" disabled
        /></label>
        <label
          >Fall Time (ms):
          <input name="fallTimeRaw" type="number" step="1" disabled
        /></label>
        <label
          >Yoke Length (mm):
          <input name="yokeLength" type="number" step="0.1" disabled
        /></label>
        <label
          >µ-steps: <input name="muSteps" type="number" step="0.5" disabled
        /></label>
        <label
          >Deg/step (°):
          <input name="degStep" type="number" step="0.1" disabled
        /></label>
        <label
          >Drive Ø (mm):
          <input name="driveDiameter" type="number" step="0.1" disabled
        /></label>
        <label
          >Servo PWM Min (µs):
          <input name="servoPwmMin" type="number" step="10" disabled
        /></label>
        <label
          >Servo PWM Max (µs):
          <input name="servoPwmMax" type="number" step="10" disabled
        /></label>
      </fieldset>
    </section>

    <section>
      <fieldset>
        <legend>Derived</legend>
        <p>Loop Height [mm]: <output id="out_loopHeight">—</output></p>
        <p>Hold High [ms]: <output id="out_holdHigh">—</output></p>
        <p>Hold Low [ms]: <output id="out_holdLow">—</output></p>
        <p>Steps/sec: <output id="out_stepsSec">—</output></p>
        <p>Min Time [ms]: <output id="out_minTime">—</output></p>
        <p>Max Angle [°]: <output id="out_maxAngle">—</output></p>
      </fieldset>
    </section>

  <hr style="margin:1em 0" />
  <div>
    <section>
      <fieldset>
        <legend>MCU Buttons</legend>
        <button id="clearLog" disabled>Clear Log</button>
        <button id="queryMcu" disabled>Query MCU</button>
        <button id="sendAll" disabled>Send All</button>
      </fieldset>
    </section>
    <!-- <button class="primary">Query MCU</button> -->
    <section>
      <fieldset>
        <legend>Run/Toggles</legend>
        <label><input id="runYoke" type="checkbox" disabled /> Run Yoke</label>
        <label
          ><input id="runConveyor" type="checkbox" disabled /> Run
          Conveyor</label
        >
      </fieldset>
    </section>
    <section>
      <fieldset>
        <legend>Presets</legend>
        <select id="preset-dd"></select>
        <button id="saveConfig" disabled>Save&nbsp;→&nbsp;MCU</button>
        <button id="savePreset" disabled>Save Preset</button>
      </fieldset>
    </section>
    
  </div>

  <textarea id="log" readonly style="height:50em"></textarea>

  <!-- ─── Main UI logic ─────────────────────────────────────── -->

  <script type="module">
import { ParameterModel, NameToID, IDToName } from "./js/ParameterModel.js";
import { buildFrame, parseFrame, CMD } from "./js/proto.js";

window.addEventListener("DOMContentLoaded", async () => {
  /* ────────────────────────────────────────────────────────────
     1.  Load presets → merge localStorage → populate dropdown → build initial model
     ──────────────────────────────────────────────────────────── */
  const presets = await ParameterModel.loadPresets();
  
  // Merge localStorage presets
  const userPresets = localStorage.getItem("userPresets");
  if (userPresets) {
    try {
      Object.assign(presets, JSON.parse(userPresets));
    } catch (e) {
      console.warn("Failed to parse user presets from localStorage:", e);
    }
  }
  
  const dd = document.getElementById("preset-dd");
  Object.keys(presets).forEach(name => {
    const opt = document.createElement("option");
    opt.value = opt.textContent = name;
    dd.appendChild(opt);
  });

  let model = await ParameterModel.fromPreset(dd.value);

  /* ────────────────────────────────────────────────────────────
     2.  Wire model → form and vice-versa
     ──────────────────────────────────────────────────────────── */
  bindModelToForm(model);

  model.addEventListener("preset",  () => bindModelToForm(model));
  model.addEventListener("change",  () => updateDerived(model));

  document.querySelectorAll("input[type=number]").forEach(ip => {
    ip.addEventListener("change", () => {
      model.update(ip.name, Number(ip.value));
      ip.value = model[ip.name];
      pendingDict[NameToID[ip.name]] = model[ip.name];
    });
  });

  runYoke.addEventListener("change", e =>
    queueToggle(NameToID.runYoke, e.target.checked));
  runConveyor.addEventListener("change", e =>
    queueToggle(NameToID.runConveyor, e.target.checked));

  dd.addEventListener("change", () => model.applyPreset(dd.value, presets));

  /* ────────────────────────────────────────────────────────────
     3.  WebSocket setup with verbose logging
     ──────────────────────────────────────────────────────────── */
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  const logBox = document.getElementById("log");
  const pendingDict = {};

  function log(line) {
    logBox.value += line + "\n";
    logBox.scrollTop = logBox.scrollHeight;
  }
  
  function sendFrame(cmd, id, val = 0) {
    ws.send(buildFrame(cmd, id, val));
    log(`→ 0x${id.toString(16).padStart(2,"0")} ${val}`);
  }
  
  function setDisabled(state) {
    document.querySelectorAll("input,button")
            .forEach(el => el.disabled = state);
  }

  ws.addEventListener("open", () => {
    log(`✓ Connected to ${ws.url}`);
    setDisabled(false);
  });

  ws.addEventListener("message", ev => {
    if (!(ev.data instanceof ArrayBuffer)) return;
    const info = parseFrame(new Uint8Array(ev.data));
    if (!info || info.cmd !== CMD.ACK) return;

    const field = IDToName[info.id];
    if (field) model.update(field, info.value);
    log(`← ACK 0x${info.id.toString(16).padStart(2,"0")} ${info.value}`);
  });

  function flushPending() {
    for (const [idStr, v] of Object.entries(pendingDict)) {
      const id = Number(idStr);
      sendFrame(CMD.SET, id, v);
    }
    Object.keys(pendingDict).forEach(k => delete pendingDict[k]);
  }
  
  function queueToggle(id, val) {
    sendFrame(CMD.TOGGLE, id, val ? 1 : 0);
  }

  /* ────────────────────────────────────────────────────────────
     4.  Button event handlers
     ──────────────────────────────────────────────────────────── */
  document.getElementById("sendAll")
          .addEventListener("click", () => {
            for (const [id, v] of Object.entries(model.toSerialDict()))
              sendFrame(CMD.SET, Number(id), v);
          });

  document.getElementById("queryMcu")
          .addEventListener("click", () =>
            sendFrame(CMD.GET, 0x00, 0));

  document.getElementById("clearLog")
          .addEventListener("click", () => (logBox.value = ""));

  document.getElementById("saveConfig")
          .addEventListener("click", () => {
            flushPending();
            sendFrame(CMD.SAVE, 0x00, 0);
            log("→ SAVE to NVS");
          });

  // Save Preset functionality
  document.getElementById("savePreset").addEventListener("click", () => {
    const name = prompt("Preset name:");
    if (!name) return;

    // 1. merge into the cached presets object
    presets[name] = model.toJSON();

    // 2. add to dropdown
    const opt = document.createElement("option");
    opt.value = opt.textContent = name;
    dd.appendChild(opt);

    // 3. persist in browser for now (localStorage)
    const userPresets = {};
    Object.keys(presets).forEach(key => {
      if (key !== "Default") userPresets[key] = presets[key];
    });
    localStorage.setItem("userPresets", JSON.stringify(userPresets));

    log(`✓ Saved preset: ${name}`);
    // TODO Phase-4: send CMD.SAVE_PRESET to MCU so it can store in NVS
  });

  updateDerived(model);

  function bindModelToForm(m) {
    Object.entries(m.toJSON()).forEach(([k, v]) => {
      const ip = document.querySelector(`input[name="${k}"]`);
      if (!ip) return;
      if (ip.type === "checkbox") ip.checked = !!v;
      else ip.value = v;
    });
    runYoke.checked = !!m.runYoke;
    runConveyor.checked = !!m.runConveyor;
    updateDerived(m);
  }
  
  function updateDerived(m) {
    out_loopHeight.textContent = m.loopHeight.toFixed(2);
    out_holdHigh.textContent = m.holdHighCalc.toFixed(2);
    out_holdLow.textContent = m.holdLowCalc.toFixed(2);
    out_stepsSec.textContent = m.stepsSecCalc.toFixed(2);
    out_minTime.textContent = m.minTime.toFixed(2);
    out_maxAngle.textContent = m.maxAngle.toFixed(2);
  }

});
</script>

</body>
</html>
