<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stepper-Servo Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <h2>Stepper-Servo Controller</h2>


    <section>
      <fieldset>
        <legend>Parameters</legend>
        <label
          >Feed Rate (mm/min):
          <input name="feedRate" type="number" step="1" disabled
        /></label>
        <label
          >Loop Height (mm):
          <input name="loopHeightInput" type="number" step="0.1" disabled
        /></label>
        <label
          >Loop Length (mm):
          <input name="loopLength" type="number" step="0.1" disabled
        /></label>
        <label
          >Retract Length (mm):
          <input name="retractLength" type="number" step="0.1" disabled
        /></label>
      </fieldset>
    </section>

    <section>
      <fieldset>
        <legend>Configuration</legend>
        <label
          >Min Angle (°):
          <input name="minAngleRaw" type="number" step="1" disabled
        /></label>
        <label
          >deg/sec (s/°):
          <input name="degSec" type="number" step="0.0001" disabled
        /></label>
        <label
          >Rise Time (ms):
          <input name="riseTimeRaw" type="number" step="0.5000" disabled
        /></label>
        <label
          >Fall Time (ms):
          <input name="fallTimeRaw" type="number" step="0.5000" disabled
        /></label>
        <label
          >Yoke Length (mm):
          <input name="yokeLength" type="number" step="0.1" disabled
        /></label>
        <label
          >µ-steps: <input name="muSteps" type="number" step="0.5" disabled
        /></label>
        <label
          >Deg/step (°):
          <input name="degStep" type="number" step="0.1" disabled
        /></label>
        <label
          >Drive Ø (mm):
          <input name="driveDiameter" type="number" step="0.1" disabled
        /></label>
        <label
          >Servo PWM Min (µs):
          <input name="servoPwmMin" type="number" step="10" disabled
        /></label>
        <label
          >Servo PWM Max (µs):
          <input name="servoPwmMax" type="number" step="10" disabled
        /></label>
      </fieldset>
    </section>

    <section>
      <fieldset>
        <legend>Derived</legend>
        <p>Loop Height [mm]: <output id="out_loopHeight">—</output></p>
        <p>Hold High [ms]: <output id="out_holdHigh">—</output></p>
        <p>Hold Low [ms]: <output id="out_holdLow">—</output></p>
        <p>Steps/sec: <output id="out_stepsSec">—</output></p>
        <p>Min Time [ms]: <output id="out_minTime">—</output></p>
        <p>Max Angle [°]: <output id="out_maxAngle">—</output></p>
      </fieldset>
    </section>

  <hr style="margin:1em 0" />
  <div>
    <section>
      <fieldset>
        <legend>MCU Buttons</legend>
        <button id="clearLog" disabled>Clear Log</button>
        <button id="queryMcu" disabled>Query MCU</button>
        <button id="sendAll" disabled>Send All</button>
      </fieldset>
    </section>
    <!-- <button class="primary">Query MCU</button> -->
    <section>
      <fieldset>
        <legend>Run/Toggles</legend>
        <label><input id="runAll" type="checkbox" disabled /> Run All</label>
        <label><input id="runYoke" type="checkbox" disabled /> Run Yoke</label>
        <label><input id="runConveyor" type="checkbox" disabled /> Run Conveyor</label>
      </fieldset>
    </section>
    <section>
      <fieldset>
        <legend>Presets</legend>
        <select id="preset-dd"></select>
        <button id="savePreset" disabled>Save Preset</button>
        <button id="deletePreset">Delete Preset</button>
        <!-- <button id="saveConfig" disabled>Save&nbsp;→&nbsp;MCU</button> -->
        <button id="loadConfig" disabled>Reload&nbsp;⟳</button>
      </fieldset>
    </section>
    
  </div>

  <textarea id="log" readonly style="height:50em"></textarea>

  <!-- ─── Main UI logic ─────────────────────────────────────── -->

  <script type="module">
// Import modules
import { ParameterModel } from "./js/ParameterModel.js";
import { initWebSocket } from "./js/websocket-client.js";
import { initUI, setupInputHandlers, setupCheckboxHandlers, setupButtonHandlers } from "./js/ui-controller.js";
import {
  initPresetManager, createFullPreset, applyFullPreset,
  saveFullPresetToESP32, loadPresetFromESP32, loadESP32PresetList,
  deletePreset, setupDeleteHandler, getNextPresetId, incrementNextPresetId,
  addPresetToUI, getPresetCount
} from "./js/preset-manager.js";

window.addEventListener("DOMContentLoaded", async () => {
  /* ────────────────────────────────────────────────────────────
     1. GET ALL ELEMENT REFERENCES
     ──────────────────────────────────────────────────────────── */
  const domElements = {
    logBox: document.getElementById("log"),
    dropdown: document.getElementById("preset-dd"),
    runAll: document.getElementById("runAll"),
    runYoke: document.getElementById("runYoke"),
    runConveyor: document.getElementById("runConveyor"),
    out_loopHeight: document.getElementById("out_loopHeight"),
    out_holdHigh: document.getElementById("out_holdHigh"),
    out_holdLow: document.getElementById("out_holdLow"),
    out_stepsSec: document.getElementById("out_stepsSec"),
    out_minTime: document.getElementById("out_minTime"),
    out_maxAngle: document.getElementById("out_maxAngle")
  };

  /* ────────────────────────────────────────────────────────────
     2. MODEL AND MODULE INITIALIZATION
     ──────────────────────────────────────────────────────────── */
  const model = new ParameterModel();

  /* ────────────────────────────────────────────────────────────
     3. INITIALIZE MODULES
     ──────────────────────────────────────────────────────────── */
  // Initialize UI controller
  const uiControls = initUI(model, domElements);
  const { log, setDisabled, updateRunAllState, updateDerived } = uiControls;

  // Initialize preset manager
  initPresetManager(log);

  // Setup event handlers
  setupInputHandlers(model, uiControls);
  setupCheckboxHandlers(domElements, uiControls);
  setupButtonHandlers(model, uiControls);

  /* ────────────────────────────────────────────────────────────
     4. WEBSOCKET INITIALIZATION
     ──────────────────────────────────────────────────────────── */
  initWebSocket(null, {
    onOpen: async () => {
      setDisabled(false);
      domElements.dropdown.innerHTML = "";
      try {
        await loadESP32PresetList(domElements.dropdown);
        log(`✓ Loaded ${getPresetCount()} presets from ESP32`);
      } catch (error) {
        log(`✗ Failed to load ESP32 presets: ${error.message}`);
      }
    },
    onMessage: (info) => {
      // Update model from MCU responses
      if (info.id >= 0x01 && info.id <= 0x11) {
        const fieldMap = {
          0x01: 'riseTimeRaw',
          0x02: 'fallTimeRaw',
          0x03: 'holdHighRaw',
          0x04: 'holdLowRaw',
          0x05: 'minAngleRaw',
          0x06: 'maxAngleRaw',
          0x07: 'stepsPerSecondRaw',
          0x08: 'servoPwmMin',
          0x09: 'servoPwmMax',
          0x10: 'runYoke',
          0x11: 'runConveyor'
        };
        const field = fieldMap[info.id];
        if (field) {
          model.update(field, info.value);
          if (field === "runYoke" || field === "runConveyor") {
            updateRunAllState();
          }
        }
      }
    }
  }, log);

  /* ────────────────────────────────────────────────────────────
     5. PRESET HANDLERS
     ──────────────────────────────────────────────────────────── */
  // Save preset button
  document.getElementById("savePreset").addEventListener("click", async () => {
    const name = prompt("Preset name:");
    if (!name) return;

    try {
      const presetId = getNextPresetId();
      const fullPreset = createFullPreset(domElements);

      await saveFullPresetToESP32(presetId, name, fullPreset);
      addPresetToUI(presetId, name, domElements.dropdown);
      incrementNextPresetId();

      log(`✓ Saved preset "${name}" (ID: ${presetId}) with all fields to ESP32 NVS`);
    } catch (error) {
      log(`✗ Failed to save preset: ${error.message}`);
    }
  });

  // Delete preset button
  document.getElementById("deletePreset").addEventListener("click", () => {
    const opt = domElements.dropdown.options[domElements.dropdown.selectedIndex];
    const id = opt.dataset.presetId;
    if (!id) return;
    deletePreset(Number(id));
  });

  // Preset dropdown change handler
  domElements.dropdown.addEventListener("change", async () => {
    const selectedOption = domElements.dropdown.options[domElements.dropdown.selectedIndex];
    const presetId = selectedOption.dataset.presetId;

    if (presetId) {
      try {
        await loadPresetFromESP32(
          parseInt(presetId),
          model,
          (data) => applyFullPreset(data, model, { updateRunAllState, updateDerived })
        );
        log(`✓ Loaded "${domElements.dropdown.value}" (ID: ${presetId}) from ESP32 NVS`);
      } catch (error) {
        log(`✗ Failed to load preset from ESP32: ${error.message}`);
      }
    }
  });

  // Setup delete handler
  setupDeleteHandler(domElements.dropdown);

  // Initial UI update
  updateDerived(model);
});
</script>
</body>
</html>
